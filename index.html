<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wyrm Chase</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Arial', sans-serif;
        color: #f5f5f0;
      }

      #game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 2rem;
      }

      #game-title {
        font-size: 2.5rem;
        font-weight: bold;
        letter-spacing: 0.3em;
        color: #f5f5f0;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        margin-bottom: 0.5rem;
      }

      #game-subtitle {
        font-size: 0.875rem;
        color: #888;
        margin-bottom: 1rem;
      }

      #canvas-wrapper {
        border: 4px solid #444;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        background: #000;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #game-info {
        font-size: 0.75rem;
        color: #666;
        text-align: center;
        max-width: 600px;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <h1 id="game-title">WYRM CHASE</h1>
      <p id="game-subtitle">Escape. Fight. Survive.</p>
      <div id="canvas-wrapper"></div>
      <p id="game-info">
        Prototype v1.0 | WASD: Move & Jump | Z: Attack | ESC: Pause
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
