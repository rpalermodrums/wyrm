<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wyrm Chase</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: system-ui, -apple-system, sans-serif;
        }
        canvas { display: block; }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e94560;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">Loading...</div>
        <div id="ui-layer">
            <div id="vignette"></div>
            
            <div id="hud">
                <div id="hud-health">
                    <div class="life-block"></div>
                    <div class="life-block"></div>
                    <div class="life-block"></div>
                </div>
                <div id="hud-wyrm">
                    <div id="wyrm-bar"></div>
                </div>
                <div id="hud-weapon">
                    <div class="weapon-icon">⚔️</div>
                    <div id="weapon-name">Rapier</div>
                </div>
            </div>

            <div id="menus">
                <div id="title-screen" class="screen hidden">
                    <h1>Wyrm Chase</h1>
                    <button id="start-button" class="menu-button">Start Game</button>
                    <div class="cta-text">or press Space</div>
                </div>
                <div id="pause-screen" class="screen hidden">
                    <h1>Paused</h1>
                    <div class="cta-text">Press Esc to Resume</div>
                </div>
                <div id="game-over-screen" class="screen hidden">
                    <h1>SLAIN</h1>
                    <button id="retry-button" class="menu-button">Try Again</button>
                </div>
                <div id="victory-screen" class="screen hidden">
                    <h1>ESCAPED</h1>
                    <div class="cta-text">You survived the wyrm!</div>
                    <button id="play-again-button" class="menu-button">Play Again</button>
                </div>
            </div>
            
            <div id="notifications"></div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
